<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1C Clone Web Client</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="container">
      <h1>1C Enterprise Clone</h1>
      <p class="subtitle">Metadata-driven operations with JavaScript business hooks</p>

      <section class="panel">
        <h2>Authentication</h2>
        <div class="row">
          <label>
            Username
            <input id="username" value="manager" />
          </label>
          <label>
            Password
            <input id="password" type="password" value="manager" />
          </label>
        </div>
        <button id="loginBtn">Login</button>
        <div id="authState" class="muted">Not authenticated</div>
      </section>

      <section class="panel">
        <h2>Catalogs</h2>
        <div class="row">
          <label>
            Item name
            <input id="itemName" placeholder="Laptop" />
          </label>
          <label>
            SKU
            <input id="itemSku" placeholder="LP-100" />
          </label>
          <label>
            Tax rate
            <input id="itemTaxRate" type="number" step="0.01" value="0.2" />
          </label>
        </div>
        <button id="createItemBtn">Create Item</button>
        <div class="row">
          <label>
            Warehouse name
            <input id="warehouseName" placeholder="Main warehouse" />
          </label>
        </div>
        <button id="createWarehouseBtn">Create Warehouse</button>
      </section>

      <section class="panel">
        <h2>Warehouse Receipt</h2>
        <div class="row">
          <label>
            Item ID
            <input id="receiptItemId" />
          </label>
          <label>
            Warehouse ID
            <input id="receiptWarehouseId" />
          </label>
          <label>
            Quantity
            <input id="receiptQty" type="number" value="10" />
          </label>
          <label>
            Price
            <input id="receiptPrice" type="number" value="100" />
          </label>
        </div>
        <button id="createReceiptBtn">Create Receipt</button>
        <button id="postReceiptBtn">Post Last Receipt</button>
      </section>

      <section class="panel">
        <h2>Sales Invoice</h2>
        <div class="row">
          <label>
            Item ID
            <input id="invoiceItemId" />
          </label>
          <label>
            Warehouse ID
            <input id="invoiceWarehouseId" />
          </label>
          <label>
            Quantity
            <input id="invoiceQty" type="number" value="1" />
          </label>
          <label>
            Price
            <input id="invoicePrice" type="number" value="150" />
          </label>
          <label>
            Tax rate
            <input id="invoiceTaxRate" type="number" value="0.2" step="0.01" />
          </label>
        </div>
        <button id="createInvoiceBtn">Create Invoice</button>
        <button id="postInvoiceBtn">Post Last Invoice</button>
        <button id="unpostInvoiceBtn">Unpost Last Invoice</button>
      </section>

      <section class="panel">
        <h2>Register balance</h2>
        <button id="readBalanceBtn">Read StockBalance</button>
      </section>

      <section class="panel">
        <h2>Console</h2>
        <pre id="console"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
